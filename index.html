 for(let i=0,k=0;i<nb;i++){const d=cw.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=rem(d);if(i<ns)d.push(0);blocks.push(d.concat(e))}
 const fin=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)fin.push(b[i])});
 const n=ver*4+17,M=[],F=[];for(let i=0;i<n;i++){M.push(new Array(n).fill(false));F.push(new Array(n).fill(false))}
 const set=(x,y,v)=>{M[y][x]=v;F[y][x]=true};
 for(let i=0;i<n;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
 const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<n&&yy>=0&&yy<n)set(xx,yy,d!=2&&d!=4)}};
 finder(3,3);finder(n-4,3);finder(3,n-4);
 if(ver>1){const na=Math.floor(ver/7)+2,st=ver==32?26:Math.ceil((ver*4+4)/(na*2-2))*2,ps=[6];for(let p=n-7;ps.length<na;p-=st)ps.splice(1,0,p);
  for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(ps[i]+dx,ps[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}}
 const fmt=m=>{const d=m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!=0;
  for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
  for(let i=0;i<8;i++)set(n-1-i,8,g(i));for(let i=8;i<15;i++)set(8,n-15+i,g(i));set(8,n-8,true)};
 fmt(0);
 if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)!=0,a=n-11+i%3,q=Math.floor(i/3);set(a,q,c);set(q,a,c)}}
 let k=0;for(let right=n-1;right>=1;right-=2){if(right==6)right=5;for(let v=0;v<n;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?n-1-v:v;if(!F[y][x]&&k<fin.length*8){M[y][x]=((fin[k>>>3]>>>(7-(k&7)))&1)!=0;k++}}}
 const MK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const apply=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&MK[m](x,y))M[y][x]=!M[y][x]};
 const pen=()=>{let p=0;for(let t=0;t<2;t++)for(let a=0;a<n;a++){let run=1;for(let b=1;b<n;b++){const c=t?M[b][a]:M[a][b],d=t?M[b-1][a]:M[a][b-1];if(c==d){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
  for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c==M[y][x+1]&&c==M[y+1][x]&&c==M[y+1][x+1])p+=3}
  let d=0;M.forEach(r=>r.forEach(c=>{if(c)d++}));p+=Math.floor(Math.abs(d*20-n*n*10)/(n*n))*10;return p};
 let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m}apply(m)}
 apply(best);fmt(best);return M}
function qrSvg(text){try{const M=qrMatrix(text);if(!M)return"";const n=M.length;let d="";M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+4} ${y+4}h1v1h-1z`}));
 return `<svg viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="${n+8}" height="${n+8}" fill="#fff"/><path d="${d}" fill="#0f2040"/></svg>`}catch(e){return""}}

function wave(t){let i=0;return [...t].map(c=>c==" "?"&nbsp;":`<span aria-hidden="true" style="--i:${i++}">${c}</span>`).join("")}
function burst(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const h=document.querySelector(".ty");if(!h)return;
 const r=h.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const cols=["#123a7a","#2563b8","#5b9bea","#a9cdf7","#e8c36a"],sy=["♥","✦","●","✿"];
 setTimeout(()=>{for(let k=0;k<12;k++){
  const e=document.createElement("div");e.className="cf";
  e.textContent=sy[k%sy.length];e.style.color=cols[k%cols.length];e.style.fontSize=(8+Math.random()*8)+"px";
  document.body.appendChild(e);
  const a=Math.random()*Math.PI*2,d=60+Math.random()*110,x=Math.cos(a)*d,y=Math.sin(a)*d-60;
  e.animate([{transform:`translate(${cx}px,${cy}px) scale(.3) rotate(0)`,opacity:1},
   {transform:`translate(${cx+x}px,${cy+y}px) scale(1.1) rotate(${(Math.random()-.5)*360}deg)`,opacity:1,offset:.6},
   {transform:`translate(${cx+x*1.1}px,${cy+y+120}px) scale(.8) rotate(${(Math.random()-.5)*540}deg)`,opacity:0}],
   {duration:1800+Math.random()*900,easing:"cubic-bezier(.2,.7,.3,1)",delay:Math.random()*250}).onfinish=()=>e.remove();
 }},700);
}
function done(){if(S.out)return `<h2>${tx("Cảm ơn bạn!","Thank you!")}</h2><p>${tx("Bạn đã chọn không tham gia. Cảm ơn bạn đã quan tâm.","You chose not to take part. Thank you for your interest.")}</p>`;return `<h1 class="ty" aria-label="${S.lang=="en"?"Thank you!":"Cảm ơn bạn!"}">${wave(S.lang=="en"?"Thank you!":"Cảm ơn bạn!")}</h1><p class="ty-sub">${tx("Câu trả lời của bạn rất có giá trị với nghiên cứu.","Your answers are very valuable for this research.")}</p>`+
 (S.ok?"":`<div class="note">${tx("Câu trả lời chưa được gửi lên hệ thống. Bạn hãy tải file bên dưới và gửi lại cho nhóm nghiên cứu nhé.","Your answers could not be sent to the server. Please download the file below and send it to the research team.")}</div><button class="go" data-dl="1">${tx("Tải câu trả lời","Download answers")}</button>`)+`<div class="share"><p>${tx("Bạn biết ai có thể giúp thêm? Gửi link khảo sát cho họ nhé.","Know someone who could help? Share the survey link.")}</p><div class="lnk"><span>${linkUrl().replace(/^https?:\/\//,"")}</span><button data-cp="1">${tx("Sao chép","Copy")}</button></div>${navigator.share?`<button class="back" data-sh="1">${tx("Chia sẻ qua ứng dụng khác","Share via other apps")}</button>`:""}${qrBlock()}</div>`}
function qrBlock(){const v=qrSvg(linkUrl());return v?`<div class="qr">${v}</div><p class="qrc">${tx("Quét mã QR để mở khảo sát","Scan the QR code to open the survey")}</p>`:""}
async function submit(){
 const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random().toString(36).slice(2));
 S.rec=Object.assign({id,lang:S.lang,submittedAt:new Date().toISOString(),durationSec:Math.round((Date.now()-S.t0)/1000),AC1_pass:S.a.AC1==6,AC2_pass:S.a.AC2==1},S.a);
 let ok=false;const to=new Promise((_,r)=>setTimeout(r,10000));
 try{if(ENDPOINT){await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(S.rec)});ok=true}}catch(e){}
 if(!ok)try{const db=await Promise.race([window.claude&&claude.use?claude.use("db"):null,to]);const us=await claude.use("user"),uid=us&&await us.id();if(db&&uid){await Promise.race([db.doc("responses/"+uid+"/items/"+id).set(S.rec),to]);ok=true}}catch(e){}
 S.ok=ok;S.step=N+5;try{localStorage.removeItem("svy3")}catch(e){}view(1);scrollTo(0,0);
}
async function dl(){try{const d=await claude.use("downloads");const k=Object.keys(S.rec);await d.save({filename:"tra-loi-khao-sat.csv",data:k.join(",")+"\n"+k.map(x=>'"'+String(S.rec[x]).replace(/"/g,'""')+'"').join(",")})}catch(e){}}
function go(d){
 if(S.busy)return;
 if(d>0&&S.step>=5&&S.step<=N+4&&S.a[F[S.step-5].i[0]]==null){$("#mg").textContent=S.lang=="en"?"Please answer this question to continue.":"Bạn hãy trả lời câu này để tiếp tục nhé.";return}
 if(d>0&&S.step==N+4){S.busy=1;submit();return}
 S.busy=1;$("#pg").classList.add(d>0?"out":"outb");
 setTimeout(()=>{S.step+=d;S.busy=0;save();view(d);scrollTo(0,0);milestone(d)},220);
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 unlockAudio();musicSync();
 if(b.dataset.th){S.theme=isDark()?"light":"dark";save();applyTheme();b.textContent=isDark()?"☀":"☾";return}
 if(b.dataset.cp){copyLink(b);return}
 if(b.dataset.sh){shareLink();return}
 if(b.dataset.mus){S.mus=S.mus===0?1:0;save();b.classList.toggle("off",S.mus===0);musicSync();return}
 if(b.dataset.snd){S.snd=S.snd===0?1:0;save();b.classList.toggle("off",S.snd===0);if(S.snd!==0)chime([659.25]);return}
 if(b.dataset.l){S.lang=b.dataset.l;save();if(!b.dataset.go){view(0);return}}
 if(b.dataset.dl){dl();return}
 if(b.dataset.c){S.c=!S.c;b.classList.toggle("on",S.c);$("#ok").disabled=!S.c;save();return}
 if(b.dataset.no){S.out=1;S.step=N+5;view(1);return}
 if(b.dataset.q){if(S.busy)return;const q=b.dataset.q,v=b.dataset.v,n=b.parentNode.className=="dots";S.a[q]=n?+v:v;
  b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));save();tick(v);
  const nx=$("#nx");if(nx)nx.disabled=false;const m=$("#mg");if(m)m.textContent="";
  if(S.step<N+4)setTimeout(()=>{if(S.step>=5&&F[S.step-5].i[0]==q)go(1)},480);return}
 if(b.dataset.go)go(+b.dataset.go);
});
view(1);
</script></body></html>
